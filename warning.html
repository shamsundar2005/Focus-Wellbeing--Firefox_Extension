<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus session</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="warning-page">
  <main class="warning-card">
    <span class="brand-mark" aria-hidden="true">◔</span>
    <p class="eyebrow">FOCUS SESSION</p>
    <h1>Pause before you switch</h1>
    <p id="warning-copy" class="muted">This website is on your distraction list for this session.</p>
    <div class="warning-actions">
      <button id="return" class="primary">Return to my focus session</button>
      <button id="continue" class="quiet">Continue to this website</button>
    </div>
    <p id="strict-note" class="muted" hidden>Strict mode is on. Take a short pause before continuing.</p>
    <p class="privacy-note">This reminder is local to your browser. You can always leave the session.</p>
  </main>
  <script src="warning.js"></script>
</body>
</html>
